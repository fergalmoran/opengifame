services:
  app:
    image: ghcr.io/fergalmoran/opengifame:latest
    # Run as the host user so uploaded files are written with host-compatible
    # ownership. Set UID/GID in a .env file (see .env.example).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: $DATABASE_URL
      NEXTAUTH_URL: http://localhost:3000
      # Generate a strong random secret: openssl rand -base64 32
      NEXTAUTH_SECRET: changeme
      # OAuth provider credentials (fill in or move to a .env file)
      # GITHUB_ID: ""
      # GITHUB_SECRET: ""
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # FACEBOOK_CLIENT_ID: ""
      # FACEBOOK_CLIENT_SECRET: ""
    volumes:
      # Bind mount so uploaded files land on the host with the UID/GID above.
      # Create this directory before first run: mkdir -p uploads
      - ./uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opengifame
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opengifame"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
